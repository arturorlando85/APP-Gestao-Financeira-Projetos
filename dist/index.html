<style>
:root {
  /* Design System AI/R — Agentic AI Engineering. Monocromático: preto, branco e rampa de cinzas; títulos leves em display,
     números e rótulos em mono; formas retas com o canto superior direito cortado; único ícone: seta ↗.
     Layout: barra lateral escura (surface-carbon) + área de trabalho clara, tabelas densas com hairlines. */
  --gray-050: #e9e9e9; --gray-100: #d9d9d9; --gray-150: #d3d3d3; --gray-200: #bfbfbf; --gray-250: #bdbdbd; --gray-300: #a6a6a6;

  --surface: #ffffff; --ink: #000000; --rule: #000000; --label-internal: #767171; --link: #467886;
  --bg: #ffffff; --surface-2: #f4f4f4; --ink-2: #262626; --muted: #595959; --line: #d9d9d9;
  --card: var(--gray-150); --card-alt: var(--gray-250); --card-ink: #000000;
  --accent: #000000; --accent-ink: #ffffff; --accent-soft: #e9e9e9;
  --good: #000000; --good-bg: #e9e9e9; --warn: #ffffff; --warn-bg: #7f7f7f; --bad: #ffffff; --bad-bg: #000000;
  --s1: #595959; --s2: #000000; --s1-soft: #d3d3d3;
  --side: #222222; --side-ink: #ffffff; --side-muted: #a6a6a6; --side-on: #404040;
  --notch-tag: 8px; --notch-header: 7px;
  --font: "Neue Haas Grotesk Display Pro", "NeueHaasDisplay", "Inter Tight", "Helvetica Neue", Arial, sans-serif;
  --font-c: "Roboto Mono", ui-monospace, Menlo, monospace; --mono: "Roboto Mono", ui-monospace, Menlo, monospace;
  --r: 0px; color-scheme: light;
  --arrow: url("data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20viewBox%3D%220%200%2022%2024%22%3E%3Cpath%20d%3D%22M5.68%204.01L4.43%204.01L4.43%206.61L5.68%206.61L15.07%206.61L3.91%2018.20L3.02%2019.12L4.80%2020.97L5.68%2020.04L16.84%208.45L16.84%2018.20L16.84%2019.51L19.35%2019.51L19.35%2018.20L19.35%204.01L5.68%204.01%22%20fill%3D%22%23000%22%20fill-rule%3D%22evenodd%22/%3E%3C/svg%3E");
}

  --surface: #000000; --ink: #ffffff; --rule: #ffffff; --bg: #000000; --surface-2: #1a1a1a; --ink-2: #d9d9d9; --muted: #a6a6a6; --line: #383838;
  --card: var(--gray-450); --card-alt: var(--gray-650); --card-ink: #ffffff;
  --accent: #ffffff; --accent-ink: #000000; --accent-soft: #262626;
  --good: #ffffff; --good-bg: #383838; --warn: #000000; --warn-bg: #a6a6a6; --bad: #000000; --bad-bg: #ffffff;
  --s1: #a6a6a6; --s2: #ffffff; --s1-soft: #404040; --side: #000000; --side-on: #383838; color-scheme: dark; } }
:root[data-theme="dark"] {
  --surface: #000000; --ink: #ffffff; --rule: #ffffff; --bg: #000000; --surface-2: #1a1a1a; --ink-2: #d9d9d9; --muted: #a6a6a6; --line: #383838;
  --card: var(--gray-450); --card-alt: var(--gray-650); --card-ink: #ffffff;
  --accent: #ffffff; --accent-ink: #000000; --accent-soft: #262626;
  --good: #ffffff; --good-bg: #383838; --warn: #000000; --warn-bg: #a6a6a6; --bad: #000000; --bad-bg: #ffffff;
  --s1: #a6a6a6; --s2: #ffffff; --s1-soft: #404040; --side: #000000; --side-on: #383838; color-scheme: dark; }
* { box-sizing: border-box; }

:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.btn.ghost { border-color: transparent; background: none; } .btn[disabled] { opacity: .5; cursor: not-allowed; }

.chip.good { background: var(--good-bg); color: var(--good); border-color: transparent; } .chip.warn { background: var(--warn-bg); color: var(--warn); border-color: transparent; }
.chip.bad { background: var(--bad-bg); color: var(--bad); border-color: transparent; } .chip.acc { background: var(--accent-soft); color: var(--accent); border-color: transparent; }

.card > header p { margin: 0; color: var(--muted); font-size: 12px; }
.grid2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 20px; }

.filters { display: flex; gap: 10px; flex-wrap: wrap; align-items: end; }

.field input, .field select, .field textarea { font-size: 14px; padding: 7px 9px; border: 1px solid var(--line); border-radius: 6px; background: var(--surface); min-width: 0; color: var(--ink); }
.field input:focus, .field select:focus, .field textarea:focus { border-color: var(--accent); outline: none; box-shadow: 0 0 0 3px var(--accent-soft); }
.tbl-wrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: 13px; }

.neg { color: var(--bad); } .muted { color: var(--muted); }
.empty { padding: 28px; text-align: center; color: var(--muted); }
.row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.mchips { display: flex; gap: 6px; flex-wrap: wrap; }
.mchip { padding: 4px 10px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); cursor: pointer; font-size: 12px; }
.mchip.on { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.drop { border: 2px dashed var(--line); border-radius: 12px; padding: 40px 24px; text-align: center; background: var(--surface); display: grid; gap: 12px; justify-items: center; }
.drop.over { border-color: var(--accent); background: var(--accent-soft); }
.welcome { max-width: 760px; margin: 40px auto; display: grid; gap: 20px; padding: 0 16px; }
.welcome ul { margin: 0; padding-left: 18px; color: var(--ink-2); } .welcome li { margin: 4px 0; }
.modal-bg { position: fixed; inset: 0; background: rgb(10 16 24 / .45); display: grid; place-items: center; z-index: 50; padding: 16px; }
.modal { background: var(--surface); border-radius: 12px; width: min(760px, 100%); max-height: calc(100% - 32px); overflow: auto; border: 1px solid var(--line); box-shadow: 0 20px 50px rgb(0 0 0 / .25); }
.modal header { padding: 16px 20px; border-bottom: 1px solid var(--line); display: flex; align-items: center; gap: 12px; position: sticky; top: 0; background: var(--surface); z-index: 1; }
.modal .body { padding: 16px 20px; display: grid; gap: 14px; }
.modal footer { padding: 12px 20px; border-top: 1px solid var(--line); display: flex; gap: 8px; justify-content: flex-end; position: sticky; bottom: 0; background: var(--surface); }
.fgrid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px; }
fieldset { border: 1px solid var(--line); border-radius: 8px; padding: 12px; margin: 0; display: grid; gap: 12px; } legend { padding: 0 6px; font-size: 12px; color: var(--muted); font-weight: 600; }
.errs { background: var(--bad-bg); color: var(--bad); border-radius: 6px; padding: 8px 12px; font-size: 13px; }
.note { background: var(--surface-2); border: 1px solid var(--line); border-radius: 6px; padding: 10px 12px; font-size: 13px; color: var(--ink-2); }
.toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 8px; z-index: 60; font-size: 13px; max-width: 90vw; }
.busy { position: fixed; inset: 0; background: rgb(10 16 24 / .35); display: grid; place-items: center; z-index: 70; color: #fff; font-weight: 600; }
.tip { position: fixed; pointer-events: none; background: var(--ink); color: var(--bg); font-size: 12px; padding: 6px 9px; border-radius: 6px; z-index: 80; white-space: nowrap; display: none; }
.chart text { fill: var(--muted); font-size: 11px; font-family: var(--font); } .chart .grid { stroke: var(--line); }
.chart .lbl { fill: var(--ink-2); } .chart rect.bar { fill: var(--s1); } .chart rect.bar.hl { fill: var(--s2); } .chart rect.hit { fill: transparent; }
.chart .ln { stroke: var(--s1); stroke-width: 2; fill: none; } .chart .dot { fill: var(--s1); stroke: var(--surface); stroke-width: 2; }
.chart .zero { stroke: var(--muted); }
.legend { display: flex; gap: 14px; font-size: 12px; color: var(--ink-2); } .legend i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 5px; vertical-align: -1px; }
.crumbs { font-size: 13px; color: var(--muted); } .crumbs button { border: 0; background: none; color: var(--accent); cursor: pointer; padding: 0; }
.phead { display: flex; gap: 16px; align-items: flex-start; flex-wrap: wrap; } .phead .t { flex: 1; min-width: 240px; display: grid; gap: 6px; }
.dl { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px 20px; } .dl div span { display: block; font-size: 12px; color: var(--muted); }
.people { display: grid; gap: 4px; max-height: 220px; overflow: auto; border: 1px solid var(--line); border-radius: 6px; padding: 6px; }
.people label, .checks label { display: flex; gap: 8px; align-items: center; padding: 4px 6px; border-radius: 4px; cursor: pointer; } .people label:hover { background: var(--surface-2); }
.checks { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 2px; max-height: 220px; overflow: auto; }
.hin { width: 78px; text-align: right; padding: 5px 7px; border: 1px solid var(--line); border-radius: 6px; background: var(--surface); color: var(--ink); font-variant-numeric: tabular-nums; }
.hin.d { width: 58px; } .hsel { padding: 5px 6px; border: 1px solid var(--line); border-radius: 6px; background: var(--surface); color: var(--ink); max-width: 150px; }
.hnote { width: 160px; padding: 5px 7px; border: 1px solid var(--line); border-radius: 6px; background: var(--surface); color: var(--ink); }
tr.chg td { background: var(--accent-soft); } #adj-body td:first-child { min-width: 300px; }
table.tree tr.g0 td { background: var(--surface-2); font-weight: 600; cursor: pointer; } table.tree tr.g1 td { cursor: pointer; } table.tree tr.g0:hover td, table.tree tr.g1:hover td { background: var(--accent-soft); }
table.tree tr.g1 td { font-weight: 500; } .tw { display: flex; align-items: baseline; gap: 6px; flex-wrap: nowrap; } .tw .muted, .tw a { white-space: nowrap; } .chev { display: inline-block; width: 14px; transition: transform .15s; color: var(--muted); font-weight: 700; } .chev.on { transform: rotate(90deg); }
table.tree tr.leaf td { background: var(--surface); } table.tree tr.leaf.chg td { background: var(--accent-soft); } table.tree tfoot td { background: var(--surface); } .hin:focus, .hsel:focus, .hnote:focus { border-color: var(--accent); outline: none; box-shadow: 0 0 0 3px var(--accent-soft); }
.sticky-bar { position: sticky; bottom: 0; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 12px 16px; display: flex; gap: 12px; align-items: center; flex-wrap: wrap; box-shadow: 0 -6px 20px rgb(0 0 0 / .06); }
.who { display: grid; gap: 8px; max-height: 60vh; overflow: auto; }
.whob { display: grid; text-align: left; gap: 2px; padding: 10px 14px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); cursor: pointer; }
.whob:hover, .whob:focus-visible { border-color: var(--accent); background: var(--accent-soft); } .whob.last { border-color: var(--accent); } .whob span { font-size: 12px; color: var(--muted); }
.av { width: 22px; height: 22px; border-radius: 50%; }
@media (max-width: 900px) {
  .app { grid-template-columns: 1fr; } .side { position: static; height: auto; flex-direction: row; flex-wrap: wrap; border-right: 0; border-bottom: 1px solid var(--line); }
  .side .foot, .brand span { display: none; } .nav { width: auto; } .grid2, .grid3 { grid-template-columns: 1fr; } .content, .top { padding-left: 16px; padding-right: 16px; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }

/* ===== AI/R: camadas de componentes ===== */
body { font-weight: 300; -webkit-font-smoothing: antialiased; }
h1 { font-size: 34px; font-weight: 200; letter-spacing: -.01em; line-height: 1.15; }
h2 { font-family: var(--mono); font-size: 13px; font-weight: 500; text-transform: uppercase; letter-spacing: .04em; }
h3 { font-family: var(--mono); }
a { color: var(--ink); text-underline-offset: 3px; }
:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
.mono, td.n, th.n, .kpi .v, .chip, .badge, .btn, .nav, th, .mchip, legend, .field, .crumbs { font-family: var(--mono); }
td.n { font-size: 12.5px; }
/* lateral escura */
.side { background: var(--side); color: var(--side-ink); border-right: 0; padding: 22px 14px; }
.brand { padding: 2px 8px 22px; display: grid; gap: 14px; color: var(--side-ink); }
.brand svg { width: 120px; height: auto; display: block; }
.brand .prod { font-family: var(--mono); font-size: 11px; letter-spacing: .06em; text-transform: uppercase; color: var(--side-muted); border-top: 1px solid var(--gray-600); padding-top: 12px; }
.brand .prod b { display: block; color: var(--side-ink); font-size: 12px; font-weight: 500; margin-bottom: 2px; }
.nav { color: var(--side-muted); border-radius: 0; font-size: 12px; letter-spacing: .03em; text-transform: uppercase; padding: 10px 12px; }
.nav:hover { background: var(--gray-650); color: #fff; }
.nav.on { background: var(--side-on); color: #fff; font-weight: 500; clip-path: polygon(0 0, calc(100% - var(--notch-header)) 0, 100% var(--notch-header), 100% 100%, 0 100%); }
.nav.on::after { content: ""; margin-left: auto; width: 10px; height: 11px; background: currentColor; -webkit-mask: var(--arrow) center/contain no-repeat; mask: var(--arrow) center/contain no-repeat; }
.side .foot { color: var(--side-muted); font-family: var(--mono); font-size: 11px; }
.side .foot b { color: #fff; font-weight: 500; }
.side .foot .btn { background: transparent; color: #fff; border-color: var(--gray-450); }
.internal { font-family: var(--font); font-weight: 300; font-size: 12px; color: var(--label-internal); letter-spacing: .02em; }
/* barra superior: hairline */
.top { background: var(--surface); border-bottom: 2px solid var(--rule); }
.top .file { font-family: var(--mono); font-size: 12px; color: var(--ink-2); }
.content { gap: 24px; }
/* botões: retos, primário preto com canto cortado */
.btn { border-radius: 0; border: 1px solid var(--ink); background: var(--surface); color: var(--ink); font-size: 12px; letter-spacing: .03em; text-transform: uppercase; padding: 8px 14px; font-weight: 500; }
.btn:hover { background: var(--gray-050); border-color: var(--ink); }
.btn.pri { background: var(--ink); color: var(--surface); border-color: var(--ink); clip-path: polygon(0 0, calc(100% - var(--notch-header)) 0, 100% var(--notch-header), 100% 100%, 0 100%); padding-right: 18px; }
.btn.pri:hover { background: var(--gray-600); filter: none; }
.btn.ghost { border-color: transparent; background: transparent; text-decoration: underline; text-underline-offset: 3px; }
.btn.ghost:hover { background: var(--gray-050); }
.btn.danger { color: var(--ink); border-color: var(--ink); } .btn.ghost.danger { border-color: transparent; }
.btn.sm { padding: 5px 9px; font-size: 11px; }
/* tags/chips: cinza com canto cortado; status por tom (claro = bom, escuro = atenção) */
.chip { border-radius: 0; border: 0; background: var(--card); color: var(--card-ink); font-size: 11px; font-weight: 500; padding: 3px 12px 3px 8px; clip-path: polygon(0 0, calc(100% - var(--notch-tag)) 0, 100% var(--notch-tag), 100% 100%, 0 100%); }
.chip.good { background: var(--gray-050); color: #000; } .chip.warn { background: var(--gray-400); color: #fff; } .chip.bad { background: var(--ink); color: var(--surface); }
.chip.acc { background: var(--gray-600); color: #fff; }
.badge { border-radius: 0; background: var(--ink); color: var(--surface); font-family: var(--mono); font-weight: 500; font-size: 11px; padding: 3px 10px; clip-path: polygon(0 0, calc(100% - var(--notch-tag)) 0, 100% var(--notch-tag), 100% 100%, 0 100%); }
/* cartões: retos, sem sombra, hairline superior */
.card { border: 0; border-top: 2px solid var(--rule); border-radius: 0; background: var(--surface); padding: 16px 0 0; }
.card > header { margin-bottom: 14px; } .card > header p { font-family: var(--font); font-size: 13px; }
.card > header h2::before { content: ""; display: inline-block; width: 10px; height: 11px; margin-right: 8px; background: currentColor; -webkit-mask: var(--arrow) center/contain no-repeat; mask: var(--arrow) center/contain no-repeat; vertical-align: -1px; }
section.card[style*="padding:0"] { padding: 0 !important; }
/* indicadores: rampa de cinzas, números em mono */
.kpis { gap: 10px; }
.kpi { border: 0; border-radius: 0; padding: 16px 18px 18px; background: var(--gray-050); color: #000; }
.kpi:nth-child(2) { background: var(--gray-150); } .kpi:nth-child(3) { background: var(--gray-250); } .kpi:nth-child(4) { background: var(--gray-500); color: #fff; } .kpi:nth-child(5) { background: var(--gray-700); color: #fff; }

<script>
/* Safe Harbor — motor de leitura/escrita da planilha V7 (sem dependências além de JSZip).
   Funciona no navegador (window.SHCore) e no Node (module.exports). */
(function (root) {
  'use strict';

  // ---------- utilidades ----------
  const decodeXml = s => s.replace(/&(lt|gt|quot|apos|amp|#x([0-9a-fA-F]+)|#(\d+));/g, (m, n, hx, dc) =>
    n === 'lt' ? '<' : n === 'gt' ? '>' : n === 'quot' ? '"' : n === 'apos' ? "'" : n === 'amp' ? '&' :
    hx ? String.fromCodePoint(parseInt(hx, 16)) : String.fromCodePoint(parseInt(dc, 10)));
  const encXml = s => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;')
    .replace(/[\u0000-\u0008\u000B\u000C\u000E-\u001F]/g, '');
  const colToNum = c => { let n = 0; for (const ch of c) n = n * 26 + ch.charCodeAt(0) - 64; return n; };
  const numToCol = n => { let s = ''; while (n > 0) { const m = (n - 1) % 26; s = String.fromCharCode(65 + m) + s; n = Math.floor((n - 1) / 26); } return s; };
  const splitRef = r => { const m = /^([A-Z]+)(\d+)$/.exec(r); return { col: m[1], row: +m[2], c: colToNum(m[1]) }; };
  const norm = s => String(s == null ? '' : s).trim().replace(/\s+/g, ' ').toLowerCase();
  const EPOCH = Date.UTC(1899, 11, 30);
  const serialToISO = n => { const d = new Date(EPOCH + Math.round(n) * 86400000); return d.toISOString().slice(0, 10); };
  const isoToSerial = s => { const [y, m, d] = s.split('-').map(Number); return Math.round((Date.UTC(y, m - 1, d) - EPOCH) / 86400000); };
  const isISO = v => typeof v === 'string' && /^\d{4}-\d{2}-\d{2}$/.test(v);
  const attr = (a, name) => { const m = new RegExp('(?:^|\\s)' + name + '="([^"]*)"').exec(a); return m ? m[1] : null; };

  // ---------- fórmulas: deslocamento de referências relativas ----------
  function shiftFormula(f, dr, dc) {
    if (!dr && !dc) return f;
    let out = '', seg = '', i = 0;
    const flush = () => {
      out += seg.replace(/(^|[^A-Za-z0-9_.$\]])(\$?)([A-Z]{1,3})(\$?)(\d+)(?![A-Za-z0-9_(\[])/g, (m, pre, d1, col, d2, row) => {
        const c = d1 ? col : numToCol(colToNum(col) + dc);
        const r = d2 ? row : String(+row + dr);
        return pre + d1 + c + d2 + r;
      });
      seg = '';
    };
    while (i < f.length) {
      const ch = f[i];
      if (ch === '"' || ch === "'") {
        flush(); let j = i + 1;
        while (j < f.length) { if (f[j] === ch) { if (f[j + 1] === ch) { j += 2; continue; } break; } j++; }
        out += f.slice(i, j + 1); i = j + 1;
      } else if (ch === '[') {
        flush(); let depth = 0, j = i;
        for (; j < f.length; j++) { if (f[j] === '[') depth++; else if (f[j] === ']') { depth--; if (!depth) break; } }
        out += f.slice(i, j + 1); i = j + 1;
      } else { seg += ch; i++; }
    }
    flush();
    return out;
  }

  // ---------- planilha (XML) ----------
  function parseSST(xml) {
    if (!xml) return [];
    const out = [];
    const re = /<si>([\s\S]*?)<\/si>/g; let m;
    while ((m = re.exec(xml))) {
      const body = m[1].replace(/<rPh[\s\S]*?<\/rPh>/g, '');

      while ((k = tr.exec(body))) t += k[1] ? decodeXml(k[1]) : '';

    }
    return out;
  }

  // Lê as linhas de uma aba preservando o XML bruto de cada célula
  function parseSheet(xml, sst) {
    const sdStart = xml.indexOf('<sheetData');
    const sdOpenEnd = xml.indexOf('>', sdStart) + 1;
    const selfClosed = xml[sdOpenEnd - 2] === '/';
    const sdEnd = selfClosed ? sdOpenEnd : xml.indexOf('</sheetData>');
    const head = xml.slice(0, sdStart), tail = xml.slice(selfClosed ? sdOpenEnd : sdEnd + 12);
    const body = selfClosed ? '' : xml.slice(sdOpenEnd, sdEnd);
    const rows = new Map();
    const rowRe = /<row\s([^>]*?)(\/>|>([\s\S]*?)<\/row>)/g; let rm;
    const shared = {};
    while ((rm = rowRe.exec(body))) {
      const rAttrs = rm[1]; const r = +attr(rAttrs, 'r');
      const cells = new Map();
      const inner = rm[3] || '';
      const cRe = /<c\s([^>]*?)(\/>|>([\s\S]*?)<\/c>)/g; let cm;
      while ((cm = cRe.exec(inner))) {

        const fm = /<f(\s[^>]*?)?(?:\/>|>([\s\S]*?)<\/f>)/.exec(ci);
        if (fm) {
          cell.fAttrs = fm[1] || '';
          cell.f = fm[2] != null ? decodeXml(fm[2]) : null;
          const ft = attr(cell.fAttrs, 't');
          if (ft === 'shared') {
            const si = attr(cell.fAttrs, 'si');
            if (cell.f != null && cell.f !== '') shared[si] = { f: cell.f, ref };
            else cell.sharedSi = si;
          }
        }
        const vm = /<v>([\s\S]*?)<\/v>/.exec(ci);
        const im = /<is>([\s\S]*?)<\/is>/.exec(ci);
        if (cell.t === 's' && vm) cell.v = sst[+vm[1]];
        else if (cell.t === 'inlineStr' && im) { let t = ''; im[1].replace(/<t(?:\s[^>]*)?>([\s\S]*?)<\/t>/g, (x, y) => { t += decodeXml(y); }); cell.v = t; }
        else if (cell.t === 'str' && vm) cell.v = decodeXml(vm[1]);
        else if (cell.t === 'b' && vm) cell.v = vm[1] === '1';
        else if (cell.t === 'e' && vm) cell.v = null, cell.err = vm[1];
        else if (vm) cell.v = +vm[1];

      rows.set(r, { attrs: rAttrs, cells });
    }

    for (const row of rows.values()) for (const cell of row.cells.values()) {

        const m = shared[cell.sharedSi];
        if (m) { const a = splitRef(m.ref), b = splitRef(cell.ref); cell.f = shiftFormula(m.f, b.row - a.row, b.c - a.c); }

  }

  function cellXml(ref, s, val, opts = {}) {
    const sa = s != null ? ` s="${s}"` : '';
    const cma = opts.cm ? ` cm="${opts.cm}"` : '';
    if (opts.f != null) {
      let fa = opts.fAttrs || '';
      if (attr(fa, 't') === 'array') fa = fa.replace(/ref="[^"]*"/, `ref="${ref}"`);
      let vx = '', ta = '';
      if (typeof opts.v === 'number' && isFinite(opts.v)) vx = `<v>${opts.v}</v>`;
      else if (typeof opts.v === 'string') { ta = ' t="str"'; vx = `<v>${encXml(opts.v)}</v>`; }
      else if (typeof opts.v === 'boolean') { ta = ' t="b"'; vx = `<v>${opts.v ? 1 : 0}</v>`; }
      else if (opts.err) { ta = ' t="e"'; vx = `<v>${encXml(opts.err)}</v>`; }
      return `<c r="${ref}"${sa}${ta}${cma}><f${fa}>${encXml(opts.f)}</f>${vx}</c>`;
    }
    if (val == null || val === '') return `<c r="${ref}"${sa}/>`;
    if (typeof val === 'number' && isFinite(val)) return `<c r="${ref}"${sa}><v>${val}</v></c>`;
    if (typeof val === 'boolean') return `<c r="${ref}"${sa} t="b"><v>${val ? 1 : 0}</v></c>`;
    if (isISO(val) && opts.date) return `<c r="${ref}"${sa}><v>${isoToSerial(val)}</v></c>`;

  // célula existente sem alteração (fórmula expandida, sem valor em cache)

      return cellXml(ref, cell.s, null, { f: shiftFormula(cell.f, dr, 0), fAttrs: cell.fAttrs, cm: cell.cm, v: cell.v, err: cell.err });
    }
    return cellXml(ref, cell.s, cell.v, { date: false });
  }
  function serializeRows(rows) {
    const keys = [...rows.keys()].sort((a, b) => a - b);
    let out = '';
    for (const r of keys) {
      const row = rows.get(r);
      const cells = [...row.cells.entries()].sort((a, b) => a[0] - b[0]);
      const a = row.attrs.replace(/(^|\s)r="\d+"/, `$1r="${r}"`);

      out += `<row ${a}>` + cells.map(([, x]) => x.xml != null ? x.xml : keepCellXml(x, x.ref, 0)).join('') + '</row>';

  }

  const cellVal = (rows, r, c) => { const row = rows.get(r); const x = row && row.cells.get(c); return x ? x.v : null; };

  // ---------- leitura do modelo ----------
  const BL_FIELDS = ['Nome da Proposta', 'Cliente', 'Projeto', 'iStudio', 'Papel', 'Senioridade', 'Vaga Intranet', 'Profissional',
    'Custo Profissional', 'R$/H', 'Mês de Execução', 'Horas Provisionadas', 'Horas Executadas', 'Valor Bruto', 'Valor Liquido',
    'Resultado Bruto', 'MB Profissional', 'Status da Receita', 'Obs', 'PIS', 'COFINS', 'INSS', 'ISSQN'];
  const BL_INPUT = ['Nome da Proposta', 'iStudio', 'Papel', 'Senioridade', 'Vaga Intranet', 'Profissional', 'Custo Profissional',
    'R$/H', 'Mês de Execução', 'Horas Provisionadas', 'Horas Executadas', 'Status da Receita', 'Obs'];
  const PROP_FIELDS = ['PowerHouse', 'Proposta', 'Cliente', 'Projeto', 'Ano Fiscal', 'Chance de Conversão', 'iStudio', 'Pre Sales Lead',
    'Start Date', 'End Date', 'COLT OPT', 'Valor Assinado'];

  let uid = 0; const nid = p => p + (++uid).toString(36) + Math.random().toString(36).slice(2, 6);

  async function load(buf, JSZipLib) {
    const JSZ = JSZipLib || root.JSZip;
    const zip = await JSZ.loadAsync(buf);
    const keepBuf = buf;
    const txt = p => zip.file(p) ? zip.file(p).async('string') : Promise.resolve(null);
    const wb = await txt('xl/workbook.xml');
    const rels = await txt('xl/_rels/workbook.xml.rels');
    const relMap = {};
    rels.replace(/<Relationship\s([^>]*?)\/>/g, (m, a) => { relMap[attr(a, 'Id')] = attr(a, 'Target'); });
    const sheets = {};
    wb.replace(/<sheet\s([^>]*?)\/>/g, (m, a) => {
      const name = decodeXml(attr(a, 'name')); let t = relMap[attr(a, 'r:id')];
      t = t.startsWith('/') ? t.slice(1) : 'xl/' + t;
      sheets[name] = { path: t, sheetId: +attr(a, 'sheetId') };
    });
    const sst = parseSST(await txt('xl/sharedStrings.xml'));
    // tabelas por aba
    for (const name in sheets) {
      const s = sheets[name]; const rp = s.path.replace(/worksheets\//, 'worksheets/_rels/') + '.rels';
      const r = await txt(rp); s.relsPath = rp; s.tables = [];
      if (r) r.replace(/<Relationship\s([^>]*?)\/>/g, (m, a) => {
        if (/\/table"?$/.test(attr(a, 'Type') || '') || /tables\//.test(attr(a, 'Target'))) {
          const tp = 'xl/' + attr(a, 'Target').replace(/^\.\.\//, ''); s.tables.push(tp);
        }
      });
    }
    const tables = {};
    for (const name in sheets) for (const tp of sheets[name].tables) {
      const x = await txt(tp);
      const tn = attr(x.match(/<table\s[^>]*>/)[0], 'name'); const ref = attr(x.match(/<table\s[^>]*>/)[0], 'ref');
      const cols = []; x.replace(/<tableColumn\s([^>]*?)(\/>|>)/g, (m, a) => { cols.push(decodeXml(attr(a, 'name'))); });
      const trc = +(attr(x.match(/<table\s[^>]*>/)[0], 'totalsRowCount') || 0);
      tables[tn] = { name: tn, path: tp, ref, cols, sheet: name, totals: trc };
      sheets[name].table = tn;
    }
    const parsed = {};
    const getSheet = async name => parsed[name] || (parsed[name] = parseSheet(await txt(sheets[name].path), sst));

    // ---- Config ----
    const cfgName = Object.keys(sheets).find(n => /config/i.test(n));
    const cfg = await getSheet(cfgName);
    const maxRow = Math.max(...cfg.rows.keys());
    const listCol = c => { const out = []; for (let r = 2; r <= maxRow; r++) { const v = cellVal(cfg.rows, r, c); if (v != null && v !== '' && v !== '-' && typeof v === 'string') out.push(v); } return [...new Set(out)]; };
    const lists = {
      statusProposta: listCol(1), revenue: listCol(3), istudio: listCol(5), perfil: listCol(7), senioridade: listCol(9),
      clientes: listCol(15), bp: listCol(16), powerhouse: listCol(18)
    };
    let taxRow = null;
    for (let r = 2; r <= 40; r++) { const u = cellVal(cfg.rows, r, 21); if (typeof u === 'number' && u > 0 && u < 1) { taxRow = r; break; } }
    const taxes = taxRow ? { row: taxRow, PIS: cellVal(cfg.rows, taxRow, 21), COFINS: cellVal(cfg.rows, taxRow, 22), INSS: cellVal(cfg.rows, taxRow, 23), ISSQN: cellVal(cfg.rows, taxRow, 24), OPEX: cellVal(cfg.rows, taxRow, 25) }
      : { row: null, PIS: 0.0065, COFINS: 0.03, INSS: 0.027, ISSQN: 0.02, OPEX: 0.0981 };
    // calendário de dias/horas úteis (Config T:V)
    const MESES = ['janeiro', 'fevereiro', 'março', 'abril', 'maio', 'junho', 'julho', 'agosto', 'setembro', 'outubro', 'novembro', 'dezembro'];
    const workdays = {};
    for (let r = 2; r <= Math.min(maxRow, 60); r++) {
      const t = cellVal(cfg.rows, r, 20), d = cellVal(cfg.rows, r, 21), h = cellVal(cfg.rows, r, 22);
      const i = typeof t === 'string' ? MESES.indexOf(t.trim().toLowerCase()) : -1;
      if (i >= 0 && typeof d === 'number' && d >= 1 && typeof h === 'number') workdays[i + 1] = { dias: d, horas: h };
    }
    const cfgClients = [];
    for (let r = 2; r <= maxRow; r++) {
      const n = cellVal(cfg.rows, r, 27); if (!n || typeof n !== 'string') continue;
      cfgClients.push({ name: n, sheet: cellVal(cfg.rows, r, 28), table: cellVal(cfg.rows, r, 29), status: cellVal(cfg.rows, r, 31), row: r });
    }
    const keys = [];
    for (let r = 2; r <= maxRow; r++) {
      const k = cellVal(cfg.rows, r, 32); if (!k || typeof k !== 'string') continue;
      keys.push({ key: k, trib: cellVal(cfg.rows, r, 33) || 'Tributado' });
    }

    // ---- clientes (abas BL) ----
    const clients = [];
    const blSheets = Object.keys(sheets).filter(n => /^BL_/.test(n) && n !== 'BL_Template' && sheets[n].table);
    for (const sn of blSheets) {
      const cc = cfgClients.find(c => c.sheet === sn);
      const sh = await getSheet(sn);
      let name = cc ? cc.name : null;
      if (!name) { const t = sh.rows.get(1) && sh.rows.get(1).cells.get(1); const m = t && /—\s*(.+)$/.exec(t.v || ''); name = m ? m[1].trim() : sn.replace(/^BL_/, ''); }
      clients.push({ id: nid('c'), name, sheet: sn, table: sheets[sn].table, status: cc ? cc.status || 'Ativo' : 'Ativo', cfgRow: cc ? cc.row : null });
    }
    const clientByName = n => clients.find(c => norm(c.name) === norm(n));
    const extraClients = [...lists.clientes].filter(n => !clientByName(n));
    for (const n of extraClients) clients.push({ id: nid('c'), name: n, sheet: null, table: null, status: 'Ativo' });

    clients.forEach(c => { c.inList = lists.clientes.some(n => norm(n) === norm(c.name)); });
    // ---- alocações ----
    const allocations = []; const blMeta = {};
    for (const c of clients.filter(c => c.sheet)) {
      const sh = parsed[c.sheet]; const t = tables[c.table];
      const [a, b] = t.ref.split(':').map(splitRef);
      const colOf = {}; t.cols.forEach((h, i) => { colOf[h] = a.c + i; });
      blMeta[c.sheet] = { table: t.name, cols: t.cols, colOf, firstCol: a.c, startRow: a.row + 1, endRow: b.row - (t.totals || 0), totals: t.totals || 0, tplRow: null };
      for (let r = a.row + 1; r <= b.row - (t.totals || 0); r++) {
        const row = sh.rows.get(r); if (!row) continue;
        const g = h => { const x = row.cells.get(colOf[h]); return x ? x.v : null; };
        if (!blMeta[c.sheet].tplRow) blMeta[c.sheet].tplRow = r;
        const proj = g('Projeto'), prof = g('Profissional');
        if ((proj == null || proj === '') && (prof == null || prof === '')) continue;
        const f = {};
        for (const h of t.cols) { let v = g(h); if (h === 'Mês de Execução' && typeof v === 'number') v = serialToISO(v); f[h] = v; }
        const nCell = row.cells.get(colOf['Valor Bruto']);
        let mult = 1; if (nCell && nCell.f) { const mm = /^\s*M\d+\*J\d+\*([\d.]+)\s*$/.exec(nCell.f); if (mm) mult = +mm[1]; }
        let brutoFixed = null; // valor bruto digitado à mão (sem fórmula) e diferente de horas × R$/h
        if (nCell && !nCell.f && typeof nCell.v === 'number' && Math.abs(nCell.v - (+g('Horas Executadas') || 0) * (+g('R$/H') || 0)) > 0.005) brutoFixed = nCell.v;
        const iCell = row.cells.get(colOf['Custo Profissional']);
        const st = row.cells.get(colOf['Status da Receita']);
        if (st && st.f) f['Status da Receita'] = null;
        const extraFormula = t.cols.some(h => !BL_FIELDS.includes(h) && h !== 'Custo Total Profissional' && row.cells.get(colOf[h]) && row.cells.get(colOf[h]).f);
        allocations.push({ id: nid('a'), sheet: c.sheet, project: String(proj == null ? '' : proj), fields: f, mult,
          costFormula: !!(iCell && iCell.f), extraFormula, brutoFixed, orig: { row: r }, dirty: false });
      }
    }

    // ---- propostas (mapeadas pelo nome da coluna) ----
    const propName = Object.keys(sheets).find(n => /propostas/i.test(n));
    const ps = await getSheet(propName); const pt = tables[sheets[propName].table];
    const [pa, pb] = pt.ref.split(':').map(splitRef);
    const pcol = {}; pt.cols.forEach((h, i) => { pcol[h] = pa.c + i; });
    const hasFunding = 'Funding' in pcol;
    const proposals = [];
    for (let r = pa.row + 1; r <= pb.row - (pt.totals || 0); r++) {
      const row = ps.rows.get(r); if (!row) continue;
      const f = {};
      for (const h of [...PROP_FIELDS, 'Funding']) { if (!(h in pcol)) continue; const x = row.cells.get(pcol[h]); let v = x ? x.v : null; if ((h === 'Start Date' || h === 'End Date') && typeof v === 'number') v = serialToISO(v); f[h] = v; }
      if (!f['Cliente'] && !f['Projeto'] && !f['Proposta']) continue;
      const L = row.cells.get(pcol['Valor Assinado']);
      proposals.push({ id: nid('p'), fields: f, lFormula: L && L.f ? L.f : null, orig: { row: r }, dirty: false });
    }

    // ---- projetos (união propostas + alocações + chaves) ----
    const projects = []; const pk = (cl, n) => norm(cl) + '|' + norm(n);
    const findProj = (clientName, name) => projects.find(p => pk(p.client, p.name) === pk(clientName, name));
    const keyTrib = (cl, n) => { const k = keys.find(k => norm(k.key) === pk(cl, n)); return k ? k.trib : null; };
    for (const a of allocations) {
      const c = clients.find(c => c.sheet === a.sheet);
      if (!findProj(c.name, a.project)) projects.push({ id: nid('j'), client: c.name, name: a.project.trim(), trib: null });
    }
    for (const p of proposals) {
      const cl = clientByName(p.fields['Cliente']); const cname = cl ? cl.name : String(p.fields['Cliente'] || '').trim();
      const pn = String(p.fields['Projeto'] || '').trim();

    for (const p of projects) {

      p.trib = keyTrib(p.client, p.name) ||
        (c && c.sheet ? (() => { const a = allocations.find(a => a.sheet === c.sheet && norm(a.project) === norm(p.name)); return a ? keyTrib(a.fields['Cliente'], p.name) : null; })() : null) || 'Tributado';
    }
    if (hasFunding) refreshTrib({ projects, proposals, hasFunding });
    const usedKeys = new Set(projects.map(p => pk(p.client, p.name)));
    const orphanKeys = keys.filter(k => !usedKeys.has(norm(k.key)) && !allocations.some(a => norm(a.fields['Cliente'] + '|' + a.project) === norm(k.key)));

    // ---- pessoas e perfis (aba "Acessos") ----
    const people = []; const accName = Object.keys(sheets).find(n => norm(n) === 'acessos');
    if (accName) {
      const as = await getSheet(accName); const hdr = as.rows.get(1); const hc = {};
      if (hdr) for (const [ci, x] of hdr.cells) if (typeof x.v === 'string') hc[norm(x.v)] = ci;
      const maxR = Math.max(1, ...as.rows.keys());
      for (let r = 2; r <= maxR; r++) {
        const g = k => hc[k] ? cellVal(as.rows, r, hc[k]) : null;
        const nome = g('nome'); if (!nome || typeof nome !== 'string' || !nome.trim()) continue;
        people.push({ id: nid('u'), name: nome.trim(), role: String(g('função') || g('funcao') || 'Delivery Leader').trim(),
          clients: String(g('clientes') || '').split(/\s*;\s*/).map(x => x.trim()).filter(Boolean),
          active: !/^n(ã|a)o$/i.test(String(g('ativo') || 'Sim').trim()) });

    return {
      people, accName,
      zip, sheets, tables, sst, parsedCache: parsed, cfgName, propName, lists, taxes, workdays, cfgClients, orphanKeys,
      clients, projects, proposals, allocations, blMeta, propTable: pt.name, fileName: null, buf: keepBuf, hasFunding,
    };
  }

  // Regra nova: tributação vem do Funding da proposta (Sim = Isento). O Excel usa a 1ª chave encontrada.
  function refreshTrib(m) {
    if (!m.hasFunding) return;
    for (const p of m.projects) {
      const ps = m.proposals.filter(x => norm(x.client || x.fields['Cliente']) === norm(p.client) && norm(x.fields['Projeto']) === norm(p.name));
      const vals = ps.map(x => String(x.fields['Funding'] || '').trim().toLowerCase() === 'sim');
      p.trib = vals.length && vals[0] ? 'Isento' : 'Tributado';
      p.tribConflict = vals.length > 1 && vals.some(v => v !== vals[0]);
      p.noProposal = !ps.length;
    }
  }
  function projectOf(m, clientName, projName) {
    return m.projects.find(p => norm(p.client) === norm(clientName) && norm(p.name) === norm(projName)) || null;
  }
  // ---------- cálculos ----------
  function taxRate(m) { const t = m.taxes; return (t.PIS || 0) + (t.COFINS || 0) + (t.INSS || 0) + (t.ISSQN || 0); }
  function calcAlloc(m, a, projTrib) {
    const f = a.fields; const he = +f['Horas Executadas'] || 0, rate = +f['R$/H'] || 0, custo = +f['Custo Profissional'] || 0;
    const bruto = a.brutoFixed != null ? a.brutoFixed : he * rate * (a.mult || 1);
    const imp = projTrib === 'Isento' ? 0 : bruto * taxRate(m);
    const liq = bruto - imp; const custoTot = custo * he; const res = liq - custoTot;
    return { bruto, imp, liq, custoTot, res, mb: liq ? res / liq : 0 };
  }

  // ---------- exportação ----------
  async function exportXlsx(m, JSZipLib) {
    const JSZ = JSZipLib || root.JSZip;
    const zip = await JSZ.loadAsync(m.buf);
    const sheets = { ...m.sheets }, tables = { ...m.tables }, blMeta = { ...m.blMeta };
    refreshTrib(m);
    const txt = p => zip.file(p) ? zip.file(p).async('string') : Promise.resolve(null);
    const sst = m.sst;
    const fresh = async name => parseSheet(await txt(sheets[name].path), sst);
    const clientOf = sheet => m.clients.find(c => c.sheet === sheet);
    const projTrib = (clientName, name) => { const p = m.projects.find(p => norm(p.client) === norm(clientName) && norm(p.name) === norm(name)); return p ? p.trib : 'Tributado'; };
    const taxRow = m.taxes.row || 9;
    const cfgQ = `'${m.cfgName.replace(/'/g, "''")}'`;

    // 1) novas abas BL para clientes novos
    let wbXml = await txt('xl/workbook.xml'); let relsXml = await txt('xl/_rels/workbook.xml.rels');
    let ctXml = await txt('[Content_Types].xml');
    for (const c of m.clients.filter(c => c.isNew && c.createSheet && !sheets[c.sheet])) {
      const tplName = 'BL_Template'; const tpl = sheets[tplName];
      const nSheets = Object.keys(zip.files).filter(f => /^xl\/worksheets\/sheet\d+\.xml$/.test(f)).map(f => +f.match(/(\d+)\.xml$/)[1]);
      const nTables = Object.keys(zip.files).filter(f => /^xl\/tables\/table\d+\.xml$/.test(f)).map(f => +f.match(/(\d+)\.xml$/)[1]);
      const sNum = Math.max(...nSheets) + 1, tNum = Math.max(...nTables) + 1;
      let sx = await txt(tpl.path);
      sx = sx.replace(/\scodeName="[^"]*"/, '').replace(/\stabSelected="1"/, '').replace(/\sxr:uid="[^"]*"/g, '');
      zip.file(`xl/worksheets/sheet${sNum}.xml`, sx);
      let tx = await txt(tpl.tables[0]);
      const ids = []; for (const tp of Object.values(tables)) { const x = await txt(tp.path); ids.push(+attr(x.match(/<table\s[^>]*>/)[0], 'id')); }
      const newId = Math.max(...ids) + 1;
      tx = tx.replace(/(<table\s[^>]*?)\sid="\d+"/, `$1 id="${newId}"`).replace(/name="tbl_Template"/, `name="${c.table}"`)
        .replace(/displayName="tbl_Template"/, `displayName="${c.table}"`).replace(/\sxr3?:uid="[^"]*"/g, '');
      zip.file(`xl/tables/table${tNum}.xml`, tx);
      zip.file(`xl/worksheets/_rels/sheet${sNum}.xml.rels`, `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/table" Target="../tables/table${tNum}.xml"/></Relationships>`);
      const rid = 'rId' + (Math.max(...[...relsXml.matchAll(/Id="rId(\d+)"/g)].map(x => +x[1])) + 1);
      relsXml = relsXml.replace('</Relationships>', `<Relationship Id="${rid}" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet${sNum}.xml"/></Relationships>`);
      const sid = Math.max(...[...wbXml.matchAll(/sheetId="(\d+)"/g)].map(x => +x[1])) + 1;
      wbXml = wbXml.replace('</sheets>', `<sheet name="${encXml(c.sheet)}" sheetId="${sid}" r:id="${rid}"/></sheets>`);
      ctXml = ctXml.replace('</Types>', `<Override PartName="/xl/worksheets/sheet${sNum}.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/><Override PartName="/xl/tables/table${tNum}.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.table+xml"/></Types>`);

  // ================= Config.xlsx (regras) =================
  // Lê as abas do Config e sobrepõe as regras do modelo carregado do Database.
  async function loadConfig(m, buf, JSZipLib) {

    const zip = await JSZ.loadAsync(buf);
    const txt = p => zip.file(p) ? zip.file(p).async('string') : Promise.resolve(null);
    const wb = await txt('xl/workbook.xml'); const rels = await txt('xl/_rels/workbook.xml.rels');

    const table = async name => { // linhas como objetos pelo cabeçalho da linha 1
      const rows = await rowsOf(name); if (!rows) return [];

  let el = document.getElementById('ov'); if (!el) { el = document.createElement('div'); el.id = 'ov'; el.innerHTML = '<div id="ov-m"></div><div id="ov-t"></div>'; document.body.appendChild(el); }
  const mEl = document.getElementById('ov-m'), tEl = document.getElementById('ov-t');
  if (S.modal !== ovModal || (S.modal && S.modal.redraw)) {
    mEl.innerHTML = S.modal ? modalHtml() : ''; ovModal = S.modal;
    if (S.modal) {
      S.modal.redraw = false;
      const first = mEl.querySelector('.modal input:not([type=hidden]), .modal select'); if (first && !S.modal.focused) { S.modal.focused = true; first.focus(); }
      if (S.modal.kind === 'alloc') { if (!S.modal.opened) { S.modal.opened = true; autoRate('open'); } else updateRateHint(); }
    }
  }
  let o = '';
  if (S.toast) o += `<div class="toast" role="status">${esc(S.toast)}</div>`;
  if (S.busy) o += `<div class="busy">${esc(S.busy)}</div>`;
  tEl.innerHTML = o;
}
function toast(t) { S.toast = t; renderOverlays(); clearTimeout(toast.t); toast.t = setTimeout(() => { S.toast = null; renderOverlays(); }, 3800); }

function bindDrop() {
  const dz = $('#drop'), fi = $('#file'); if (!dz) return;
  fi.onchange = () => fi.files.length && openFiles([...fi.files]);
  dz.ondragover = e => { e.preventDefault(); dz.classList.add('over'); }; dz.ondragleave = () => dz.classList.remove('over');
  dz.ondrop = e => { e.preventDefault(); dz.classList.remove('over'); const fs = [...e.dataTransfer.files]; if (fs.length) openFiles(fs); };
}
async function kindOf(buf) { // identifica pelo conteúdo: Database tem "2. Propostas"; Config tem "Impostos"
  try { const z = await JSZip.loadAsync(buf); const wb = await z.file('xl/workbook.xml').async('string');
    if (/name="2\. Propostas"/.test(wb)) return 'db'; if (/name="Impostos"/.test(wb)) return 'cfg'; } catch (e) {} return null;
}
async function openFiles(files) {
  files = files.filter(f => /\.xlsx$/i.test(f.name)); if (!files.length) { toast('Escolha os arquivos .xlsx'); return; }
  S.busy = 'Lendo arquivos…'; renderOverlays();
  try {
    let db = null, cfg = null;
    for (const f of files) { const buf = await f.arrayBuffer(); const k = await kindOf(buf); if (k === 'db') db = { f, buf }; else if (k === 'cfg') cfg = { f, buf }; }
    if (!db) throw new Error('não encontrei o Database (arquivo com a aba 2. Propostas)');
    const m = await C.load(db.buf); if (cfg) await C.loadConfig(m, cfg.buf);
    S.m = m; S.fileName = db.f.name; S.cfgFileName = cfg ? cfg.f.name : null; S.ver++; S.changes = []; S.adj.draft = {}; S.view = 'dashboard'; S.projId = null; S.f.year = ''; S.f.month = ''; S.src = null;
    if (!cfg) toast('Config.xlsx não foi enviado: usando as regras do próprio Database. Envie os dois arquivos juntos para usar o Config.');
  } catch (e) { console.error(e); toast('Não consegui ler os arquivos: ' + e.message); }
  S.busy = null; render();
}
async function openFile(f) { return openFiles([f]); }

function groupSum(rows, keyFn) {
  const mp = new Map(); rows.forEach(r => { const k = keyFn(r); const g = mp.get(k) || { key: k, b: 0, l: 0, r: 0 }; g.b += r.k.bruto; g.l += r.k.liq; g.r += r.k.res; mp.set(k, g); });
  return [...mp.values()];
}

// ---------------- limpeza automática de backups (mais de 3 dias) ----------------
const BACKUP_DAYS = 3;
async function pruneBackups(dir) {
  try {
    let bdir; try { bdir = await dir.getDirectoryHandle('_backups_safeharbor'); } catch (e) { return 0; }
    const items = [];
    for await (const [name, h] of bdir.entries()) {
      if (h.kind !== 'file' || !/\.xlsx$/i.test(name)) continue;
      const m = /^(.*)_backup_(\d{4})(\d{2})(\d{2})_(\d{2})(\d{2})\.xlsx$/i.exec(name);
      let at; if (m) at = Date.UTC(+m[2], +m[3] - 1, +m[4], +m[5], +m[6]); else { try { at = (await h.getFile()).lastModified; } catch (e) { continue; } }
      items.push({ name, base: m ? m[1] : name, at });
    }
    // mantém sempre o backup mais recente de cada arquivo (Database e Config), mesmo que seja antigo
    const newest = {}; for (const it of items) if (!newest[it.base] || it.at > newest[it.base].at) newest[it.base] = it;
    const limit = Date.now() - BACKUP_DAYS * 86400000; let n = 0;
    for (const it of items) if (it.at < limit && newest[it.base] !== it) { try { await bdir.removeEntry(it.name); n++; } catch (e) { console.warn('não apagou', it.name, e); } }
    if (n) S.lastPrune = { n, at: new Date() };
    return n;
  } catch (e) { console.warn(e); return 0; }
}

const LOCK_FILE = '_safeharbor.lock', LOCK_BEAT = 60e3, LOCK_STALE = 3 * 60e3, LOCK_IDLE = 10 * 60e3;
const SESSION = Math.random().toString(36).slice(2) + Date.now().toString(36);
let lockTimer = null; S.lastAct = Date.now();
const myName = () => { try { return localStorage.getItem('sh-editor-name') || ''; } catch (e) { return ''; } };

}

function setLockState(l) {

  if (mine) S.lock.requested = false;
}
async function acquireLock(interactive) {
  if (!S.src) return false;
  if (!myName() && interactive) { S.modal = { kind: 'lockName', then: 'acquire' }; renderOverlays(); return false; }
  const dir = S.src.dir; const cur = await readLock(dir);
  if (cur && cur.session !== SESSION && lockFresh(cur)) { setLockState(cur); render(); return false; }
  const now = new Date().toISOString();
  await writeLock(dir, { holder: myName() || 'Alguém', session: SESSION, since: now, heartbeat: now, request: null, app: 'Safe Harbor Financeiro' });
  await new Promise(r => setTimeout(r, 1500)); // confere se ninguém gravou ao mesmo tempo
  const chk = await readLock(dir); setLockState(chk); S.lastAct = Date.now(); S.ver++; render();
  if (S.lock.mine && interactive) toast('Você está editando. Para os outros, o app fica somente leitura.');
  return S.lock.mine;
}
async function releaseLock(reason) {
  if (!S.src || !S.lock || !S.lock.mine) return;
  if (S.changes.length) await saveNow();
  try { const cur = await readLock(S.src.dir); if (cur && cur.session === SESSION) await S.src.dir.removeEntry(LOCK_FILE); } catch (e) {}
  S.lock = { mine: false, free: true, requested: false }; S.ver++; render();

}
async function lockTick() {
  if (!S.src || !S.m) return;
  try {
    const cur = await readLock(S.src.dir);
    if (S.lock && S.lock.mine) {
      if (!cur || cur.session !== SESSION) { // alguém assumiu (ex.: o computador ficou suspenso)
        setLockState(cur); S.ver++; render();
        toast(cur && lockFresh(cur) ? `${cur.holder} assumiu a edição. O app ficou somente leitura${S.changes.length ? '; você tem alterações não gravadas' : ''}.` : 'A trava de edição expirou.');
        return;
      }
      if (cur.request && (!S.lock.request || S.lock.request.at !== cur.request.at)) { S.lock.request = cur.request; render(); toast(`${cur.request.by} pediu para editar.`); }
      if (Date.now() - S.lastAct > LOCK_IDLE && !S.changes.length && !S.modal) return releaseLock('Edição liberada por inatividade (10 minutos). Clique em Editar para retomar.');
      await writeLock(S.src.dir, { ...cur, heartbeat: new Date().toISOString() });
    } else {
      const wasHolder = S.lock && S.lock.holder;
      setLockState(cur);
      if (S.lock.free && S.lock.requested) { await acquireLock(false); if (S.lock.mine) toast('A edição foi liberada para você.'); return; }
      if (wasHolder !== S.lock.holder || S.view !== 'welcome') render();

}
async function requestEdit() {
  if (!myName()) { S.modal = { kind: 'lockName', then: 'request' }; renderOverlays(); return; }
  const cur = await readLock(S.src.dir);
  if (!cur || !lockFresh(cur)) return acquireLock(true);
  await writeLock(S.src.dir, { ...cur, request: { by: myName(), at: new Date().toISOString() } });
  S.lock.requested = true; render(); toast(`Pedido enviado para ${cur.holder}. A edição passa para você assim que for liberada.`);
}

  if (!S.src) return;

  dClrAll: () => { FDIMS.forEach(([k]) => S.f[k] = ''); render(); },
  dDrill: el => { if (S.dEdit) return; const dim = el.dataset.dim, key = el.dataset.key; if (!key) return;
    if (dim === 'month') { S.f.period = 'mes'; S.f.month = key; toast(`Período: só ${mLabel(key)}. Volte em "Período" para ver o ano.`); render(); return; }
    const D = DIMS[dim]; if (!D || !D.f) return; if (dim === 'proj' && key.startsWith('x|')) return;
    S.f[D.f] = key; if (dim === 'cli') S.f.proj = ''; if (MORE_F.includes(D.f)) S.dMoreF = true;
    render(); toast(`Filtro aplicado: ${D.l} = ${dim === 'proj' ? (S.m.projects.find(p => p.id === key) || {}).name : dim === 'status' ? stLabel(key) : key}`); },
});
document.addEventListener('change', e => { const el = e.target; if (el.dataset && el.dataset.dsize != null) { const w = curBoard().widgets[+el.dataset.dsize]; if (w) { w.size = +el.value; saveDash(); render(); } } });
document.addEventListener('input', e => { const el = e.target; if (el.dataset && el.dataset.dq) { const id = el.dataset.dq; S.dq[id] = el.value; S.dOpen[id] = S.dOpen[id]; const pos = el.selectionStart; render(); const n = document.querySelector(`[data-dq="${id}"]`); if (n) { n.focus(); n.setSelectionRange(pos, pos); } } });
document.addEventListener('dragstart', e => { const h = e.target.closest && e.target.closest('.drag'); if (!h) return; const card = h.closest('.dw'); S.dDrag = +h.dataset.wi; e.dataTransfer.effectAllowed = 'move'; e.dataTransfer.setData('text/plain', h.dataset.wi); try { e.dataTransfer.setDragImage(card, 24, 24); } catch (x) {} setTimeout(() => card.classList.add('dragging'), 0); });
document.addEventListener('dragover', e => { if (S.dDrag == null) return; const c = e.target.closest && e.target.closest('.dw'); if (!c) return; e.preventDefault(); document.querySelectorAll('.dw.over').forEach(x => x !== c && x.classList.remove('over')); c.classList.add('over'); });
document.addEventListener('drop', e => { if (S.dDrag == null) return; const c = e.target.closest && e.target.closest('.dw'); if (!c) return; e.preventDefault(); const b = curBoard(), from = S.dDrag, to = +c.dataset.wi; S.dDrag = null;
  if (from !== to) { const [w] = b.widgets.splice(from, 1); b.widgets.splice(to, 0, w); saveDash(); } render(); });
document.addEventListener('dragend', () => { S.dDrag = null; document.querySelectorAll('.dw.over,.dw.dragging').forEach(x => x.classList.remove('over', 'dragging')); });

// ---------------- eventos ----------------
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]'); if (!el) return;
  const fn = A[el.dataset.act]; if (!fn) return;
  if (el.dataset.act === 'closeBg' && e.target !== el) return;
  e.preventDefault(); fn(el, e);
});
document.addEventListener('change', e => {
  const el = e.target;
  if (el.dataset.adj && el.dataset.adj !== 'q') { S.adj[el.dataset.adj] = el.value; if (el.dataset.adj === 'month' && Object.keys(S.adj.draft).length) { toast('Ajustes pendentes de outro mês continuam guardados até aplicar ou descartar.'); } render(); return; }
  if (el.matches && el.matches('[data-mot]')) { adjInput(el); return; }
  if (el.dataset.bind === 'pf.q') return;
  if (el.dataset.bind) { const [o, k] = el.dataset.bind.split('.'); S[o][k] = el.value; if (o === 'f' && k === 'year') S.f.month = ''; if (o === 'f' && k === 'client') S.f.proj = ''; render(); return; }
  if (el.dataset.actChange === 'autosave') { S.autosave = el.checked; try { localStorage.setItem('sh-autosave', el.checked ? '1' : '0'); } catch (x) {} if (S.autosave && S.changes.length) scheduleSave(500); render(); return; }
  if (el.closest && el.closest('#mform') && ['iStudio', 'Papel', 'Senioridade', 'Mês de Execução'].includes(el.name)) { perfisChange(el.name); return; }
  if (el.closest && el.closest('#mform') && ['R$/H', 'Custo Profissional'].includes(el.name)) updateRateHint();
  if (el.dataset.actChange === 'roleSel') { const a = isAdminRole(el.value); const w = document.getElementById('pcl-wrap'), n = document.getElementById('pcl-admin'); if (w) w.hidden = a; if (n) n.hidden = !a; return; }
  if (el.dataset.actChange === 'clientSel' && S.modal) { S.modal.client = el.value; const on = el.value === '__new'; ['nc-wrap', 'ns-wrap'].forEach(id => { const x = document.getElementById(id); if (x) x.hidden = !on; }); if (on) document.querySelector('[name=newClient]').focus(); }
});
document.addEventListener('input', e => {
  const el = e.target;
  if (el.dataset.adj === 'q') { S.adj.q = el.value; const pos = el.selectionStart; render(); const n = document.querySelector('[data-adj="q"]'); if (n) { n.focus(); n.setSelectionRange(pos, pos); } return; }
  if (el.matches && el.matches('[data-he],[data-days],[data-note]')) { adjInput(el); return; }
  if (el.dataset.bind === 'pf.q') { S.pf.q = el.value; const pos = el.selectionStart; render(); const n = document.querySelector('[data-bind="pf.q"]'); if (n) { n.focus(); n.setSelectionRange(pos, pos); } }
});
document.addEventListener('submit', e => { if (e.target.id === 'mform') { e.preventDefault(); submitModal(e.target); } });
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && S.modal && S.modal.kind !== 'who' && !S.modal.first) A.close();
  if ((e.key === 'Enter' || e.key === ' ') && e.target.matches && e.target.matches('tr[data-act="adjToggle"]')) { e.preventDefault(); const k = e.target.dataset.k; A.adjToggle(e.target, e); setTimeout(() => { const n = [...document.querySelectorAll('tr[data-act="adjToggle"]')].find(x => x.dataset.k === k); if (n) n.focus(); }, 0); }
  if (e.key === 'Enter' && e.target.matches && e.target.matches('[data-he],[data-days]')) {
    e.preventDefault(); const attr = e.target.matches('[data-he]') ? '[data-he]' : '[data-days]';
    const all = [...document.querySelectorAll(attr)]; const i = all.indexOf(e.target); const nx = all[i + (e.shiftKey ? -1 : 1)]; if (nx) { nx.focus(); nx.select(); }
  }
});
const tip = document.getElementById('tip');
document.addEventListener('mousemove', e => { const t = e.target.closest && e.target.closest('[data-tip]'); if (!t) { tip.style.display = 'none'; return; }
  tip.textContent = t.dataset.tip; tip.style.display = 'block'; const w = tip.offsetWidth; tip.style.left = Math.min(window.innerWidth - w - 8, e.clientX + 12) + 'px'; tip.style.top = (e.clientY + 14) + 'px'; });
window.addEventListener('beforeunload', e => { if (S.changes.length) { e.preventDefault(); e.returnValue = ''; } });

render();
initPlatform();
startup();
</script>
</body>
</html>
